name: Bug report
description: Something does not work, gives an error or a wrong result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. CycloDesk is in alpha, so every report helps.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do (menu, tool, parameters), what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: The error message in the window or in the Log tab, if there was one.
      render: text
  - type: textarea
    id: code
    attributes:
      label: R code of the step
      description: From the R code tab (the code of the step that went wrong).
      render: r
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Shown under Help > About and at the bottom of the window (CycloDesk, WaverideR, astrochron), plus your operating system.
      placeholder: "CycloDesk 0.1.0, WaverideR 0.6.0, astrochron 1.8, Windows 11"
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data
      description: If you can, attach a small data file that shows the problem (drag it into this box).
