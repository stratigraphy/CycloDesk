<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CycloDesk</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1f2933; --muted: #6b7785; --accent: #1f4e79; --err: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1f24; --fg: #e6e9ed; --muted: #9aa5b1; --accent: #6ea8dc; --err: #f97066; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; max-width: 560px; padding: 24px; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 26px; font-weight: 600; margin: 12px 0 4px; }
  .msg { color: var(--muted); }
  .spin { width: 28px; height: 28px; margin: 22px auto 0; border: 3px solid var(--muted); border-top-color: var(--accent);
    border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color: var(--err); white-space: pre-wrap; text-align: left; font-size: 13px; margin-top: 18px; display: none; }
</style>
</head>
<body>
<div class="box">
  <img src="cyclodesk.png" alt="">
  <h1>CycloDesk</h1>
  <div class="msg" id="msg">Starting R and loading the packages ...</div>
  <div class="spin" id="spin"></div>
  <div class="err" id="err"></div>
</div>
<script>
  // called by the window program when R could not start
  function showError(text) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').textContent = 'CycloDesk could not start.';
    var e = document.getElementById('err');
    e.textContent = text;
    e.style.display = 'block';
  }
</script>
</body>
</html>
